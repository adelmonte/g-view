[package]
name = "gtk-view"
version = "0.1.0"
edition = "2021"

[dependencies]
async-channel = "2.5.0"
cairo-rs = "0.18"
fast_image_resize = { version = "6.1.0", features = ["rayon"] }
gdk = "0.18"
gdk-pixbuf = "0.18"
gio = "0.18"
glib = "0.18"
gtk = "0.18"
image = "0.25"
lcms2 = "6.2.0"
pango = "0.18"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
rand = "0.10.3"
rayon = "1.12.0"
resvg = "0.50.0"

[profile.release]
strip = true
lto = "thin"
